<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">radioCL favicon</title>
  <desc id="desc">Minimalist pixel-art radio mascot icon for radioCL.</desc>

  <g shape-rendering="crispEdges">
    <!-- Antenna -->
    <rect x="7" y="2" width="2" height="6" fill="#F8FAFC"/>
    <rect x="6" y="1" width="4" height="3" fill="#111827"/>
    <rect x="7" y="1" width="2" height="2" fill="#F43F5E"/>

    <!-- Radio waves -->
    <path d="M23 4h2v1h1v1h1v2h-1V7h-1V6h-2z" fill="#22D3EE"/>
    <path d="M23 7h2v1h1v2h-1V9h-2z" fill="#22D3EE"/>
    <path d="M23 10h2v2h-2z" fill="#22D3EE"/>

    <!-- Side pads -->
    <rect x="2" y="13" width="3" height="8" fill="#111827"/>
    <rect x="3" y="14" width="2" height="6" fill="#6B7280"/>
    <rect x="27" y="13" width="3" height="8" fill="#111827"/>
    <rect x="27" y="14" width="2" height="6" fill="#6B7280"/>

    <!-- Main body -->
    <rect x="4" y="8" width="24" height="17" rx="2" fill="#111827"/>
    <rect x="5" y="9" width="22" height="15" rx="1.5" fill="#E9D6B7"/>
    <rect x="6" y="10" width="20" height="13" rx="1" fill="#F4E6CF"/>

    <!-- Handle -->
    <rect x="10" y="6" width="12" height="2" fill="#111827"/>
    <rect x="11" y="5" width="10" height="1" fill="#4B5563"/>

    <!-- Screen -->
    <rect x="7" y="11" width="13" height="8" rx="1" fill="#0B1428"/>

    <!-- Face -->
    <rect x="9" y="14" width="1" height="1" fill="#22D3EE"/>
    <rect x="10" y="13" width="2" height="1" fill="#22D3EE"/>
    <rect x="12" y="14" width="1" height="1" fill="#22D3EE"/>

    <rect x="15" y="14" width="1" height="1" fill="#22D3EE"/>
    <rect x="16" y="13" width="2" height="1" fill="#22D3EE"/>
    <rect x="18" y="14" width="1" height="1" fill="#22D3EE"/>

    <rect x="12" y="16" width="4" height="1" fill="#22D3EE"/>
    <rect x="13" y="17" width="2" height="1" fill="#22D3EE"/>

    <!-- Speaker -->
    <rect x="22" y="11" width="3" height="1" fill="#6B6258"/>
    <rect x="22" y="13" width="3" height="1" fill="#6B6258"/>
    <rect x="22" y="15" width="3" height="1" fill="#6B6258"/>
    <rect x="22" y="17" width="3" height="1" fill="#6B6258"/>

    <!-- Knobs -->
    <rect x="7" y="20" width="3" height="3" fill="#111827"/>
    <rect x="8" y="21" width="1" height="1" fill="#6B7280"/>
    <rect x="22" y="20" width="3" height="3" fill="#111827"/>
    <rect x="23" y="21" width="1" height="1" fill="#6B7280"/>

    <!-- Tuning bar -->
    <rect x="11" y="20" width="10" height="3" fill="#111827"/>
    <rect x="12" y="21" width="8" height="1" fill="#6B7280"/>
    <rect x="16" y="20" width="1" height="3" fill="#F43F5E"/>

    <!-- Tiny red side accents -->
    <rect x="2" y="15" width="1" height="4" fill="#F43F5E"/>
    <rect x="29" y="15" width="1" height="4" fill="#F43F5E"/>
  </g>
</svg>
